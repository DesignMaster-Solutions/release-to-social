# Reusable workflow: on a published release, write one Buffer draft per text channel.
# Caller: uses: DesignMaster-Solutions/release-to-social/.github/workflows/drafts.yml@main  +  secrets: BUFFER_API_KEY
name: Release to Social
on:
  workflow_call:
    inputs:
      mode:
        description: "draft (default, review in Buffer), queue (channel's next slot) or now (publish at once)"
        type: string
        default: draft
      footer:
        description: "a line kept on every post, never cut (e.g. a contest mention or a disclosure; up to 200 characters)"
        type: string
        default: ""
    secrets:
      BUFFER_API_KEY:
        description: Buffer personal API key (Buffer → Settings → API → New Key; account:read, posts:read, posts:write)
        required: true
jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Save one Buffer draft per channel from the release notes
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          MODE: ${{ inputs.mode || 'draft' }}
          FOOTER: ${{ inputs.footer }}
        run: |
          jq -n --arg repo "$REPO" --arg tag "$TAG" --arg mode "$MODE" --arg footer "$FOOTER" \
            '{repo: $repo, tag: $tag, mode: $mode, footer: $footer}' > body.json
          curl -fsS https://release-to-social.designmaster.workers.dev/api/ci \
            -H "Authorization: Bearer $BUFFER_API_KEY" -H 'Content-Type: application/json' \
            -d @body.json > result.json
          jq '{release, results: [.results[] | {channel, service, ok, postId, error}]}' result.json
          bad=$(jq -r '[.results[] | select(.ok | not) | "\(.channel): \(.error)"] | join("; ")' result.json)
          echo "$(jq '[.results[] | select(.ok)] | length' result.json) post(s) ($MODE) in Buffer for $(jq -r .release.tag result.json). Review: https://publish.buffer.com/drafts"
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
